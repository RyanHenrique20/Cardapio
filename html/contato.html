<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Sabor & Arte</title>
    <link rel="stylesheet" href="../css/form.css">
</head>

<body>
    <header>
        <h1 id="titulo"><i>Restaurante Sabor & Arte</i></h1>
        <p id="slogan"><i>O sabor que transforma momentos!</i></p>
    </header>
    <section>
        <nav>
            <a class="navbar" href="../index.html">Início</a>
            <a class="navbar" href="cardapio.html">Cardápio</a>
            <a class="navbar" href="contato.html">Contato</a>
        </nav>
    </section>
   
    <main>
        <section class="campo-formulario">
            <div class="secao-formulario">
                <div class="imagem-form"></div>
                <div class="lado-formulario">
                    <form class="formulario" action="confirmacao.html" method="post">
                        <label><b><i>Nome</i></b></label>
                        <input type="text" name="nome" required>
                        <label for="email"><b><i>E-mail</i></b></label>
                        <input type="email" name="email" required>
                        <label><b><i>Mensagem</i></b></label>
                        <textarea name="mensagem"></textarea>
                        <button type="submit"><b><i>Enviar</i></b></button>
                    </form>
                </div>
            </div>    
        </section>
    <footer>
        <p>
            Para saber mais sobre nosso endereço e horário de funcionamento,
            acesse nossa página de <a href="contato.html">contato</a>.
        </p>
        <p>2026 Restaurante Sabor & Arte</p>
    </footer>
</body>
</html>
