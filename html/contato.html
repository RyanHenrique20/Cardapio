<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Sabor & Arte</title>
    <link rel="stylesheet" href="../css/form.css">
</head>

<body>
    <header>
        <h1 id="titulo"><i>Restaurante Sabor & Arte</i></h1>
        <p id="slogan"><i>O sabor que transforma momentos!</i></p>
    </header>
    <section>
        <nav>
            <a class="navbar" href="../index.html"><i>Início</i></a>
            <a class="navbar" href="cardapio.html"><i>Cardápio</i></a>
            <a class="navbar" href="contato.html"><i>Contato</i></a>
        </nav>
    </section>
   
    <main>
        <section class="campo-formulario">
            <div class="secao-formulario">
                <div class="imagem-form"></div>
                <div class="lado-formulario">
                    <h2><i>Contato</i></h2>
                <form class="formulario" action="contato.html" method="get">
                        <input type="hidden" name="sucesso" value="true">
                        <label><b><i>Nome</i></b></label>
                        <input type="text" name="nome" required>
                        <label for="email"><b><i>E-mail</i></b></label>
                        <input type="email" name="email" required>
                        <label><b><i>Mensagem</i></b></label>
                        <textarea name="mensagem"></textarea>
                        <button type="submit"><b><i>Enviar</i></b></button>
                    </form>
                </div>
            </div>    
        </section>
    <footer>
        <p>
           <i>
                Para saber mais sobre nosso endereço e horário de funcionamento,
                acesse nossa página de <a href="contato.html">contato</a>.
            </i>
        </p>
        <p><i>2026 Restaurante Sabor & Arte</i></p>
    </footer>
    <script type="text/javascript">
        const successParams = new URLSearchParams(window.location.search)
        const send = successParams.get("sucesso");

        if (send) {
            alert('Mensagem enviada com sucesso! Em breve, entraremos em contato.');
        }
    </script>
</body>
</html>
